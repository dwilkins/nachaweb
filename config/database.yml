# PostgreSQL.
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: nachaweb_development
  # The specified database role is required to connect to PostgreSQL.
  # If you are running PostgreSQL locally, you may need to add your OS user
  # to the database.
  #
  # See https://guides.rubyonrails.org/configuring.html#configuring-a-postgresql-database
  # password:
  queue:
    <<: *default
    database: nachaweb_development_queue # A separate database for SolidQueue
    migrations_paths: db/queue_migrate # This points to where SolidQueue's migrations would go if it used regular migrations


# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: nachaweb_test

  queue:
    <<: *default
    database: nachaweb_test_queue # A separate database for SolidQueue
    migrations_paths: db/queue_migrate # This points to where SolidQueue's migrations would go if it used regular migrations
# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password as a unix environment variable when you boot
# the app. Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full rundown on how to provide these environment variables in a
# production environment.
#
# On Heroku and other platform providers, you may have a full connection URL
# available as an environment variable. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# You can use this database configuration with:
#
#   production:
#     url: <%= ENV["DATABASE_URL"] %>
#
production:
  primary:
    <<: *default
    database: nachaweb_production
    username: nachaweb
    password: <%= ENV["NACHAWEB_DATABASE_PASSWORD"] %>

  queue:
    <<: *default
    database: nachaweb_production_queue # A separate database for SolidQueue
    migrations_paths: db/queue_migrate # This points to where SolidQueue's migrations would go if it used regular migrations
